    <h3>Tambah Data Barang</h3>

    <input type="text" id="nama" placeholder="Nama Barang">
    
    <!-- KHUSUS LAMPU -->
    <div id="opsiLampu">
        <select id="merek" onchange="ubahWatt()">
            <option value="">Pilih Merek (Lampu)</option>
            <option value="Philips">Philips</option>
            <option value="Osram">Osram</option>
            <option value="Panasonic">Panasonic</option>
        </select>
    
        <select id="watt">
            <option value="">Pilih Watt</option>
        </select>
    </div>
    
    <input type="number" id="harga" placeholder="Harga">
    <input type="number" id="stok" placeholder="Stok">
    
    <button onclick="tambahBarang()">Tambah</button>
    <button onclick="exportExcel()">Export Excel</button>
    


    <table id="tabelBarang">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Barang</th>
                <th>Watt</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="dataBarang">
            <!-- data dari JS -->
        </tbody>
    </table>
